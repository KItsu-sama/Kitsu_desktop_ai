# data/reflex_groups.yaml
#
# Authoring format for reflex memory groups.
# Compiled to runtime JSON at startup — never parsed during requests.
#
# Fields:
#   group      – unique identifier (snake_case)
#   priority   – higher = preferred when multiple groups match (default 5)
#   tags       – semantic labels for routing/filtering
#   tool       – optional tool binding (e.g. clock.now)
#   triggers   – natural-language trigger phrases (used for hybrid scoring)
#   responses  – weighted response pool
#     text     – response text ({time}, {time_of_day} are interpolated at emit)
#     weight   – selection probability weight (relative, not %)
#
# Personality reflexes (high priority, rarely change)
# ─────────────────────────────────────────────────────

