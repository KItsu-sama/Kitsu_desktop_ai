[project]
name = "kitsu-desktop-ai"
version = "0.1.0"
description = "Local Shimeji-style desktop AI fox with emotion system"
authors = [
    {name = "Zino Team"}
]
dependencies = [
    "psutil",
    "rich",
    "numpy",
    "PyYAML",
    "aiohttp",
]
requires-python = ">=3.11" 

# Ensure sitecustomize.py is imported on interpreter startup
# (Python auto-imports sitecustomize when it is importable on sys.path). 
[tool.blackboxai.runtime]
sitecustomize = "sitecustomize"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Code lives at the project root (application/, runtime/, etc.), not under src/.
# where = ["src"] was wrong and caused pip install -e . to find nothing.
where = ["."]
exclude = ["tests*", "data*", "*.egg-info"]