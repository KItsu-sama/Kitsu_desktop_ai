name: balanced
tier: low
description: "Bundled Micro-SLM, 2D avatar, emotion system. Works on 2-4GB RAM."

flags:
  use_fast_brain: true
  use_slm: true
  use_llm: false
  use_2d: true
  use_3d: false
  use_voice: false
  use_shimeji: false
  use_emotion: true
  use_system_control: false

startup_modules:
  required:
    - core.events
    - core.bus
    - core.clocks
    - core.orchestrator
    - core.health
    - core.performance_manager
    - config.capability_flags
    - ai.fast_brain.engine
    - ai.llm.engine
    - personality.emotion_engine
    - memory.manager
  optional:
    - vtuber.avatar_controller
    - multimodal.speech.tts

ui_mode: avatar_2d
model_downloads:
  - id: micro_slm
    size_mb: 20
    required: true
